# このファイルを settings.yaml にコピーして値を設定してください
# cp config/settings.example.yaml config/settings.yaml

# Google AI Studio で発行した Gemini APIキー
gemini_api_key: "YOUR_API_KEY_HERE"

# 画像生成に使うモデル
#  - 背景/イラストのようなアセット生成には Imagen 系を推奨
image_model: "imagen-4.0-generate-001"

# 生成画像の1辺の目安（Imagenがサポートするアスペクト比に丸められます）
generation_aspect_ratio: "1:1"

# 同一プロンプトの再生成を防ぐキャッシュを有効にするか
enable_cache: true
cache_dir: "assets/cache"

# API呼び出しの間隔（秒）。レート制限対策
request_interval_sec: 1.0

# 失敗時のリトライ回数と待機時間
max_retries: 3
retry_backoff_sec: 5

# フォント格納フォルダ
font_dir: "assets/fonts"
